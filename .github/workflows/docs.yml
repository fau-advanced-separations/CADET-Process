name: docs

on:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  docs-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . --group docs

      - name: Build
        run: sphinx-build -b html source build -D nb_execution_mode=off --keep-going
        working-directory: docs
