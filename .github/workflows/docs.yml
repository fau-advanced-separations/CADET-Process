name: docs

on:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  docs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: cadet-process

      - name: Install
        run: pip install '.[all]' --group docs

      - name: Build
        run: sphinx-build -b html source build -D nb_execution_mode=off --keep-going
        working-directory: docs
