[build-system]
requires = [
    "setuptools>=69",
    "wheel",
    "build"
]
build-backend = "setuptools.build_meta"

[project]
name = "CADET-Process"
dynamic = ["version"]
authors = [
    { name = "Johannes Schmölder", email = "j.schmoelder@fz-juelich.de" },
]
description = "A Framework for Modelling and Optimizing Advanced Chromatographic Processes"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["process modeling", "process optimization", "chromatography"]
license = { text = "GPLv3" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "addict==2.3",
    "cadet-python>=1.0.4",
    "corner>=2.2.1",
    "hopsy>=1.5.3",
    "joblib>=1.3.0",
    "numpy>=1.21",
    "matplotlib>=3.4",
    "numba>=0.55.1",
    "packaging>=26.0",
    "pathos>=0.2.8",
    "pipefunc>=0.49",
    "psutil>=5.9.8",
    "pymoo>=0.6",
    "scipy>=1.14,<1.18",
]

[dependency-groups]
testing = [
    "coverage",
    "pytest",
    "pytest-cov"
]
docs = [
    "myst-nb>=0.17.1",
    "numpydoc>=1.5.0",
    "sphinx>=5.3.0",
    "sphinxcontrib-bibtex>=2.5.0",
    "sphinx_book_theme>=1.0.0",
    "sphinx_copybutton>=0.5.1",
    "sphinx-sitemap>=2.5.0",
]
dev = [
    {include-group = "docs"},
    {include-group = "testing"},
    "certifi", # tries to prevent certificate problems on windows
    "pre-commit",
    "ruff<=0.16.0",
]

[project.optional-dependencies]
ax = [
    "ax-platform >=0.3.5,<0.5.0"
]
ipopt = [
    "cyipopt",
]
all = [
   "CADET-Process[ax,ipopt]",
]

[project.urls]
homepage = "https://github.com/fau-advanced-separations/CADET-Process"
documentation = "https://cadet-process.readthedocs.io"
"Bug Tracker" = "https://github.com/fau-advanced-separations/CADET-Process/issues"

[tool.setuptools.packages.find]
include = [
  "CADETProcess*",
  "examples*",
  "tests*"
]

[tool.setuptools.dynamic]
version = { attr = "CADETProcess.__version__" }

[tool.ruff]
src = ["CADETProcess", "tests"]
exclude = ["examples", "docs", "__init__.py"]
line-length = 88
fix = true

[tool.ruff.lint]
preview = true
select = [
  "ANN",  # type annotations
  "ARG",  # unused arguments
  "D",    # docstrings
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
]
ignore = [
  "ANN401",  # Allow dynamically typed expressions like `Any`
  "D100",    # Allow missing docstring in public module
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Pre-existing files — ARG violations to be addressed separately
"CADETProcess/optimization/population.py" = ["ARG"]
"CADETProcess/optimization/individual.py" = ["ARG"]
"CADETProcess/optimization/results.py" = ["ARG"]
"CADETProcess/optimization/pymooAdapter.py" = ["ARG"]
"CADETProcess/optimization/axAdapter.py" = ["ARG"]
"CADETProcess/optimization/scipyAdapter.py" = ["ARG"]
"CADETProcess/modelBuilder/*.py" = ["ARG"]
"CADETProcess/smoothing.py" = ["ARG"]
"CADETProcess/dataStructure/dataStructure.py" = ["ARG"]
"CADETProcess/dataStructure/parameter.py" = ["ARG"]
"CADETProcess/equilibria/*.py" = ["ARG"]
"CADETProcess/dynamicEvents/section.py" = ["ARG"]
"CADETProcess/dynamicEvents/event.py" = ["ARG"]
"CADETProcess/comparison/difference.py" = ["ARG"]
"CADETProcess/processModel/reaction.py" = ["ARG"]
"CADETProcess/reference.py" = ["ARG"]
"CADETProcess/log.py" = ["ARG"]
"CADETProcess/binding.py" = ["ARG"]
"CADETProcess/processModel/binding.py" = ["ARG"]
"CADETProcess/solution.py" = ["ARG"]
"CADETProcess/stationarity.py" = ["ARG"]
"tests/**/*.py" = [
  "ANN",   # type annotations
  "ARG",   # pytest fixtures look like unused args
  "D",     # docstrings
  "E402",  # imports not at top of module
  "E731",  # lambda assignments
  "F841",  # unused variables
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["CADETProcess"]
